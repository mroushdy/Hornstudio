<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horn Studio</title>
<style>
:root{--paper:#FFFFFF;--panel:#FAFAFA;--ink:#1C1C1C;--faint:#A6A6A6;--grid:#F0F0F0;--gridmaj:#E2E2E2;--petf:#C8331D;--base:#7A7A7A;--line:#E8E8E8;--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;}
  body{margin:0;background:var(--paper);}
  #app{min-height:100vh;background:var(--paper);color:var(--ink);padding:16px;box-sizing:border-box;}
  .frame{border:1px solid var(--gridmaj);max-width:1240px;margin:0 auto;background:var(--paper);}
  /* entry 122 (Marwan: "may need to be kept on the same line as horn studio"):
     one header line above the mobile breakpoint -- title shrinks first, the
     stat boxes compress, the brand never wraps. */
  header{display:flex;flex-wrap:nowrap;border-bottom:1px solid var(--gridmaj);align-items:center;min-width:0;}
  .ttl{min-width:0;flex:0 1 auto;}
  .tb{flex:0 1 auto;min-width:0;overflow:hidden;}
  .brand{margin-left:auto;padding:10px 20px;text-align:right;flex:0 0 auto;white-space:nowrap;}
  @media (max-width: 900px) { header{flex-wrap:wrap;} .brand{margin-left:auto;} }
  .ttl{padding:14px 20px;flex:1 1 300px;}
  .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--faint);margin-bottom:4px;}
  h1{margin:0;font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:.04em;}
  @media (min-width: 901px) and (max-width: 1280px) { .ttl h1{font-size:20px;} }   /* entry 124: stat boxes removed (static filler) */
  .cols{display:flex;flex-wrap:wrap;}
  /* entry 112 (user feedback: "make sure that all the controls are visible
     together with the graphs"): the params column is its own sticky scroll
     pane -- scroll the page to put a chart in view, then scroll INSIDE the
     panel to reach any control; the chart never leaves the screen. */
  aside{flex:0 0 262px;min-width:240px;padding:14px 16px 8px;border-right:1px solid var(--line);background:var(--panel);box-sizing:border-box;position:sticky;top:0;max-height:100vh;overflow-y:auto;align-self:flex-start;}
  /* entry 115 (Marwan: "doesnt work well on mobile... the horn viewer drops
     down but the slider menu is still sticky"): sticky is only correct in the
     two-column layout. Once the columns wrap (narrow viewport), the panel
     returns to normal flow and the 3-D viewer shrinks. */
  /* entry 116: typeset mathematics card -- browsers render MathML in a real
     math font; give it room, centering, and quiet annotations. */
  /* entry 117: white paper for the equations + an elegant math font stack --
     STIX Two Math (ships with macOS), Cambria Math (Windows), Latin Modern
     (TeX systems); the browser's MathML engine does the typesetting. */
  .mathcard{background:#FFFFFF;padding:16px 18px 8px;margin-top:6px;overflow-x:auto;}   /* entry 118: borderless -- equations on open paper */
  .mathcard math{font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math","Asana Math",math,serif;}
  .mathcard math[display="block"]{font-size:20px;margin:0 auto 16px;display:block;text-align:center;color:#000;}   /* entry 117b: true black ink on white */
  .mathcard mtext{font-size:70%;color:#555;font-family:var(--mono);letter-spacing:.03em;}
  @media (max-width: 900px) {
    aside{position:static;max-height:none;overflow-y:visible;flex:1 1 100%;border-right:none;border-bottom:1px solid var(--line);}
    #view3d{height:280px !important;}
    .mathcard math[display="block"]{font-size:16px;}
  }
  main{flex:1 1 460px;min-width:300px;}
  .sect{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--faint);margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--line);}
  .sect:first-child{margin-top:0;padding-top:0;border-top:none;}
  .param{margin-bottom:11px;}
  .param.off{opacity:.32;pointer-events:none;}
  .prow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
  .plabel{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);}
  .pnum{width:60px;font-family:var(--mono);font-size:12px;text-align:right;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--ink);outline:none;padding:1px 2px;}
  .punit{font-family:var(--mono);font-size:9px;color:var(--faint);margin-left:3px;}
  .psel{width:100%;font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:5px 6px;margin-bottom:11px;}
  input[type=range]{width:100%;accent-color:var(--petf);height:2px;-webkit-appearance:none;appearance:none;background:var(--line);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:15px;background:var(--ink);cursor:ew-resize;border-radius:0;}
  input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--petf);outline-offset:2px;}
  .btn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:8px 0;width:100%;background:transparent;border:1px solid var(--ink);color:var(--ink);cursor:pointer;margin-bottom:7px;}
  .btn:hover{background:var(--ink);color:var(--paper);}
  /* .sub retired 2026-07-13: gray buttons read as disabled; N/A actions are hidden, not dimmed */
  .toggle{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 11px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);}
  .toggle.on{background:var(--petf);color:var(--paper);border-color:var(--petf);}
  .petfrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .petflab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;font-weight:600;}
  .legend{display:flex;gap:20px;padding:2px 20px 10px;font-family:var(--mono);font-size:10px;color:var(--faint);flex-wrap:wrap;}
  .sw{display:inline-block;width:22px;margin-right:6px;vertical-align:middle;}
  .stats{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);}
  .stat{padding:9px 14px;border-left:1px solid var(--line);}
  .stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:2px;}
  .stat .v{font-family:var(--mono);font-size:15px;color:var(--ink);}
  .lower{display:flex;flex-wrap:wrap;gap:14px;border-top:1px solid var(--line);padding:12px 16px;align-items:flex-start;}
  /* entry 119 (Marwan: "why is the math and the notes section not the full
     width?"): #eqs was a sixth chart tile (flex 250px, capped 400px). It is
     now its own full-width band: equations centered on paper at a reading
     measure, method notes flowing in datasheet columns. */
  .eqs{flex:1 1 100%;font-family:var(--mono);font-size:10px;line-height:1.65;color:var(--faint);border-top:1px solid var(--line);padding-top:12px;margin-top:4px;}
  .eqs .mathcard{max-width:760px;margin:6px auto 0;}
  .eqs .mnotes{columns:320px 3;column-gap:32px;margin-top:6px;}
  .eqs .mnotes p{margin:0 0 10px;break-inside:avoid;}
  footer{border-top:1px solid var(--gridmaj);padding:8px 20px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  #errbox{display:none;background:#1C1C1C;color:#fff;padding:10px 14px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;margin:0 auto 12px;max-width:1240px;border-radius:2px;}
  #view3d{width:100%;height:300px;border:1px solid var(--line);cursor:grab;overflow:hidden;background:#FFFFFF;box-sizing:border-box;}
  #v3dnote{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:6px;line-height:1.5;}
  .petfrow{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px;}
  .petflab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;font-weight:600;}

</style>
</head>
<body>
<div id="errbox"></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

window.onerror = function (msg, src2, line) {
  var e = document.getElementById("errbox");
  e.style.display = "block";
  e.textContent = "Studio error \u2014 please report this text:\n" + msg + " (line " + line + ")";
};

(function () {

"use strict";
var C = 344000, RHO = 1.205e-9; // mm/s ; kg/mm^3 -> keep consistent units where used

/* ================= profile families: all return {wall:[{z,r}], sEnd, terminated, Ttrace} ================= */

function makeTfun(P, m) {
  if (!P.petf) return function () { return P.T0; };
  var ref = P.petfRef === "mouth" ? Math.max(0, (P.sEndEst || 0) - P.sOff) : P.sOff;
  if (P.petfShape === "tanh")
    return function (s) { return P.T0 + P.Tadd * 0.5 * (1 + Math.tanh(m * P.fmult * (s - ref))); };
  return function (s) { return P.T0 + P.Tadd * (1 - Math.exp(-m * P.fmult * Math.max(0, s - ref))); };
}

function jmlcWall(P) {
  var diagnostics = [], lawCaughtUp = false, entryDominatedLen = 0;
  var m = 4 * Math.PI * P.fc / C, rt = P.rt, N = 110, ds = C / P.fc / 1000;
  var Tf = makeTfun(P, m);
  // entry 88 (Le Cleac'h originals): the NATURAL entry angle -- "only one single
  // opening angle for a given throat diameter, fc and T" (JMLC). Closed form from
  // matching the seed cap's own growth to the law's initial slope:
  // 2*S0/R = S0*m*T with R = rt/sin(th0)  ==>  sin(th0) = rt*m*T/2.
  // VALIDATED: 27.5518 deg printed in his own axial sheet vs our 27.5518.
  // entry 88: F mouth shape factor (pi round / 4 square) scales the throat area;
  // W wall coefficient (2 free-standing / 1 = two room walls) scales the law.
  var th0;
  if (P.entryAuto) th0 = Math.asin(Math.max(0, Math.min(0.99, rt * m * (Tf(0) || 1e-6) / 2)));
  else th0 = (P.entryDeg || 0) * Math.PI / 180;
  // NOTE (entry 88): his F mouth-shape factor and W wall coefficient are recognized
  // but NOT wired into the march. F corrupts an axisymmetric march (the law and the
  // geometric revolve become incommensurate; measured: Fshape=4 stalls at the throat)
  // -- for non-round sections it is OUR EXISTING superellipse Gamma-normalization,
  // already shipped. W likely gates his mouth criterion; decode before wiring.
  var pts = [], i, S0;
  if (th0 > 0.005) {
    var R = rt / Math.sin(th0);
    for (i = 0; i < N; i++) {
      var ph = th0 * i / (N - 1);
      pts.push({ z: R * (Math.cos(ph) - Math.cos(th0)), r: R * Math.sin(ph) });
    }
    // reverse to axis->edge order with axis first: current order axis(apex, phi=0) -> rim ✓
    S0 = 2 * Math.PI * rt * rt / (1 + Math.cos(th0));
  } else {
    for (i = 0; i < N; i++) pts.push({ z: 0, r: rt * i / (N - 1) });
    S0 = Math.PI * rt * rt;
  }
  var s = 0, terminated = "max-iter", wall = [{ z: 0, r: rt }], Ttrace = [{ s: 0, T: Tf(0) }];
  var wavefronts = [], wfEvery = 40;
  function area(poly) { var A = 0, k;
    for (k = 0; k < poly.length - 1; k++)
      A += Math.PI * (poly[k].r + poly[k + 1].r) * Math.hypot(poly[k + 1].z - poly[k].z, poly[k + 1].r - poly[k].r);
    return A; }
  function resample(poly, n) {
    var cum = [0], k;
    for (k = 1; k < poly.length; k++)
      cum.push(cum[k - 1] + Math.hypot(poly[k].z - poly[k - 1].z, poly[k].r - poly[k - 1].r));
    var total = cum[cum.length - 1], out = [], j = 0;
    for (k = 0; k < n; k++) {
      var t = total * k / (n - 1);
      while (j < cum.length - 2 && cum[j + 1] < t) j++;
      var f = (t - cum[j]) / ((cum[j + 1] - cum[j]) || 1e-12);
      out.push({ z: poly[j].z + f * (poly[j + 1].z - poly[j].z), r: poly[j].r + f * (poly[j + 1].r - poly[j].r) });
    }
    out[0] = { z: poly[0].z, r: 0 };
    return out; }
  for (var it = 0; it < 12000; it++) {
    var adv = [];
    for (i = 0; i < N; i++) {
      var a = pts[Math.max(0, i - 1)], b = pts[Math.min(N - 1, i + 1)];
      var uz = b.z - a.z, ur = b.r - a.r, l = Math.hypot(uz, ur) || 1e-12; uz /= l; ur /= l;
      adv.push({ z: pts[i].z + (i === 0 ? 1 : ur) * ds, r: pts[i].r + (i === 0 ? 0 : -uz) * ds });
    }
    adv[0].r = 0; s += ds;
    var T = Tf(s);
    var Star = S0 * Math.pow(Math.cosh(m / 2 * s) + T * Math.sinh(m / 2 * s), 2);
    var dS = Star - area(adv);
    if (!isFinite(dS)) { terminated = "overflow"; break; }
    if (dS >= 0) lawCaughtUp = true;
    if (dS < 0) {
      // AUDIT #3 rev. 3 (2026-07-13): entry-angle seeds legitimately provide MORE area
      // than the young law wants -- holding the wavefront (dS = 0) until the law
      // overtakes IS the entry geometry, not an error (rev. 2 bricked working horns;
      // real-user report at 0.31%). So: before the law first catches up, clamp and
      // RECORD the entry-dominated length. AFTER catch-up, a negative dS is a genuine
      // anomaly with severity tiers:
      //   rel <= 5e-4    silent clamp (numeric noise)
      //   <= 1e-2        WARN: clamp, diagnostic, continue
      //   >  1e-2        FAIL: stop, terminated = "area-overshoot", gate exports
      if (!lawCaughtUp) { entryDominatedLen = s; dS = 0; }
      else {
        var relE = -dS / Math.max(1e-12, Star), absTol = 1e-4 * S0;
        if (-dS <= absTol || relE <= 5e-4) dS = 0;
        else if (relE <= 1e-2) {
          if (diagnostics.length < 20)
            diagnostics.push({ code: "JMLC_AREA_OVERSHOOT", severity: "warn", station: wall.length,
                               wavefrontDistance: s, targetArea: Star, advancedArea: area(adv),
                               absoluteError: -dS, relativeError: relE });
          dS = 0;
        } else {
          diagnostics.push({ code: "JMLC_AREA_OVERSHOOT", severity: "fail", station: wall.length,
                             wavefrontDistance: s, targetArea: Star, advancedArea: area(adv),
                             absoluteError: -dS, relativeError: relE });
          terminated = "area-overshoot";
          break;
        }
      }
    }
    var E = adv[N - 1], Pp = adv[N - 2];
    var tz = E.z - Pp.z, tr = E.r - Pp.r, tl = Math.hypot(tz, tr) || 1e-12; tz /= tl; tr /= tl;
    var nz = tr, nr = -tz;
    var fL = function (L) {
      var sp = Math.min(1, L / ds), cp = Math.sqrt(Math.max(0, 1 - sp * sp));
      return Math.PI * (2 * E.r + L * (cp * tr - sp * nr)) * L - dS; };
    var lo = 0, hi = ds * 0.999999;
    if (fL(hi) < 0) { terminated = "flare-limit"; break; }
    for (var k2 = 0; k2 < 50; k2++) { var mid = (lo + hi) / 2; if (fL(mid) < 0) lo = mid; else hi = mid; }
    var L = (lo + hi) / 2, sp2 = Math.min(1, L / ds), cp2 = Math.sqrt(Math.max(0, 1 - sp2 * sp2));
    var W = { z: E.z + L * (cp2 * tz - sp2 * nz), r: E.r + L * (cp2 * tr - sp2 * nr) };
    wall.push(W); Ttrace.push({ s: s, T: T });
    // AUDIT #3: truncation angle from an AVERAGED LOCAL DIRECTION over the last up-to-6
    // stations (stable, and rollback-safe -- a least-squares r(z) fit assumes r is a
    // function of z, which fails the moment the wall curls past 90 deg; caught by the
    // HVDiff rollback regression before shipping).
    var nf = Math.min(6, wall.length), iA = wall.length - nf;
    var pAz = (wall[iA].z + wall[Math.min(iA + 1, wall.length - 1)].z) / 2;
    var pAr = (wall[iA].r + wall[Math.min(iA + 1, wall.length - 1)].r) / 2;
    var pBz = (wall[wall.length - 1].z + wall[wall.length - 2].z) / 2;
    var pBr = (wall[wall.length - 1].r + wall[wall.length - 2].r) / 2;
    var deg = Math.atan2(pBr - pAr, pBz - pAz) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    if (wall.length > 8 && deg >= P.trunc) { terminated = "truncation"; break; }
    pts = resample(adv.concat([W]), N);
    if (it % wfEvery === 0) {
      var wf9 = [];
      for (var q8 = 0; q8 < N; q8 += 8) wf9.push({ z: pts[q8].z, r: pts[q8].r });
      wf9.push({ z: pts[N - 1].z, r: pts[N - 1].r });
      wavefronts.push(wf9);
    }
  }
  return { wall: wall, sEnd: s, terminated: terminated, Ttrace: Ttrace, wavefronts: wavefronts, S0: S0, m: m, diagnostics: diagnostics, entryDominatedLen: entryDominatedLen };
}

function swhWall(P) { // Kugelwellen: spherical caps of constant radius r0 = c/(pi*fc) (Kolbrek eq.18; NOT c/2pi -- see regression 1)
  var m = 4 * Math.PI * P.fc / C, rt = P.rt, R0 = C / (Math.PI * P.fc); // Klangfilm construction radius r0 = c/(pi*fc) (validated vs published SWH400 reference)
  var Tf = makeTfun(P, m);
  var h0 = R0 - Math.sqrt(Math.max(0, R0 * R0 - rt * rt));
  var dx = C / P.fc / 2000, x = 0;
  var wall = [{ z: 0, r: rt }], Ttrace = [{ s: 0, T: Tf(0) }], terminated = "max-iter";
  for (var it = 0; it < 40000; it++) {
    x += dx;
    var T = Tf(x);
    var g = Math.cosh(m / 2 * x) + T * Math.sinh(m / 2 * x);
    var h = h0 * g * g;
    if (h >= 2 * R0 * 0.999) { terminated = "closed"; break; }
    var r = Math.sqrt(Math.max(0, h * (2 * R0 - h)));
    var z = x + h0 - h;
    var prev = wall[Math.max(0, wall.length - 4)];
    wall.push({ z: z, r: r }); Ttrace.push({ s: x, T: T });
    var deg = Math.atan2(r - prev.r, z - prev.z) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    if (wall.length > 8 && deg >= P.trunc) { terminated = "truncation"; break; }
  }
  return { wall: wall, sEnd: x, terminated: terminated, Ttrace: Ttrace, S0: 2 * Math.PI * R0 * h0, m: m, R0: R0 };
}

function tractrixWall(P) { // classic tractrix, drba eqs 3-4
  var rt = P.rt, r0 = C / (2 * Math.PI * P.fc);
  if (rt >= r0 * 0.98) return { wall: [{ z: 0, r: rt }], sEnd: 0, terminated: "throat>=r0", Ttrace: [] };
  function xOf(y) { return r0 * Math.log((r0 + Math.sqrt(r0 * r0 - y * y)) / y) - Math.sqrt(r0 * r0 - y * y); }
  var x0 = xOf(rt), wall = [], n = 700, terminated = "mouth";
  for (var i = 0; i < n; i++) {
    var y = rt + (r0 * 0.9995 - rt) * i / (n - 1);
    wall.push({ z: x0 - xOf(y), r: y });
    if (i > 4) {
      var a = wall[wall.length - 2], b = wall[wall.length - 1];
      var deg = Math.atan2(b.r - a.r, b.z - a.z) * 180 / Math.PI;
      if (deg < 0) deg += 360;
      if (deg >= P.trunc) { terminated = "truncation"; break; }
    }
  }
  return { wall: wall, sEnd: wall[wall.length - 1].z, terminated: terminated, Ttrace: [], r0: r0 };
}

function hypexWall(P) { // plane-wavefront hypex, PETF applies (drba eq 1+2 literally)
  var m = 4 * Math.PI * P.fc / C, rt = P.rt, Tf = makeTfun(P, m);
  var rMouth = C / (2 * Math.PI * P.fc); // km*r = 1 criterion
  var dx = 0.5, x = 0, wall = [{ z: 0, r: rt }], Ttrace = [{ s: 0, T: Tf(0) }], terminated = "mouth-kr1";
  for (var it = 0; it < 30000; it++) {
    x += dx;
    var T = Tf(x);
    var r = rt * (Math.cosh(m / 2 * x) + T * Math.sinh(m / 2 * x));
    var prev = wall[wall.length - 1];
    wall.push({ z: x, r: r }); Ttrace.push({ s: x, T: T });
    var deg = Math.atan2(r - prev.r, dx) * 180 / Math.PI;
    if (P.trunc < 89 && deg >= P.trunc) { terminated = "truncation"; break; }
    if (r >= rMouth) { terminated = "mouth-kr1"; break; }
  }
  return { wall: wall, sEnd: x, terminated: terminated, Ttrace: Ttrace };
}

function conicalWall(P) {
  var thDeg = (P.entryDeg === undefined || P.entryDeg === null) ? 15 : P.entryDeg;
  var rt = P.rt, th = Math.max(2, Math.min(60, thDeg)) * Math.PI / 180;
  var rMouth = C / (2 * Math.PI * P.fc);
  var L = (rMouth - rt) / Math.tan(th), wall = [], n = 300;
  for (var i = 0; i < n; i++) { var z = L * i / (n - 1); wall.push({ z: z, r: rt + z * Math.tan(th) }); }
  return { wall: wall, sEnd: L, terminated: "mouth-kr1", Ttrace: [] };
}

function neileWall(P) { // semicubic parabola r = rt + K z^{3/2} (first WN horns: no expansion law)
  var rt = P.rt, K = Math.max(0.005, P.neileK || 0.06);
  var wall = [{ z: 0, r: rt }], terminated = "max-z", dz = 0.6;
  for (var i = 1; i < 5000; i++) {
    var z = i * dz, r = rt + K * Math.pow(z, 1.5);
    var prev = wall[wall.length - 1];
    wall.push({ z: z, r: r });
    var deg = Math.atan2(r - prev.r, dz) * 180 / Math.PI;
    if (P.trunc < 89 && deg >= P.trunc) { terminated = "truncation"; break; }
    if (r >= C / (2 * Math.PI * P.fc)) { terminated = "mouth-kr1"; break; }
  }
  return { wall: wall, sEnd: wall[wall.length - 1].z, terminated: terminated, Ttrace: [] };
}
